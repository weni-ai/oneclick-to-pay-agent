agents:
    payment_agent_checkout:
        credentials:
            BASE_URL:
                label: "Base URL"
                placeholder: "https://teste.myvtex.com"
                is_confidential: false
            ACCOUNT_NAME:
                label: "Account Name"
                placeholder: "teste"
                is_confidential: false
            STORE_URL:
                label: "Store URL"
                placeholder: "www.teste.bravtexstores.com.br"
                is_confidential: false
            API_TOKEN:
                label: "Project Token"
                placeholder: "1234567890"
                is_confidential: true
            VTEX_API_APPTOKEN:
                label: "VTEX App Token"
                placeholder: "SHGDFJGVJWDIKVÇLFKVBKVÇKFMEPMHMYZANOVRNTXBTHTUDTPEDFNWEIHFWOIRHGFFÇOEIKFGHIOMFDPFKQEWNQWERTYFJHFVWEGFB"
                is_confidential: true
            VTEX_API_APPKEY:
                label: "VTEX App Key"
                placeholder: "vtexappkey-TESTE-VGJTYY"
                is_confidential: true
            WHATSAPP_CVV_FLOW_ID:
                label: "WhatsApp CVV Flow ID"
                placeholder: "1451561746318256"
                is_confidential: false
            PAYMENT_REGISTRATIONS_BASE_URL:
                label: "Payment registrations API base URL"
                placeholder: "https://913e-177-37-184-15.ngrok-free.app"
                is_confidential: false
            CHANNEL_UUID:
                label: "Channel UUID (payment registration)"
                placeholder: "847d81a0-7ab8-4fd9-9aad-56d7a46f0387"
                is_confidential: false
            PAYMENT_REGISTRATIONS_BEARER_TOKEN:
                label: "Bearer token for payment-registrations API (optional if same as project auth)"
                placeholder: ""
                is_confidential: true
        name: "Checkout Agent"
        description: "Agent responsible for the checkout process, this agent can make a cart for a customer and process payments via credit card or PIX. For credit card payments, it sends a confirmation message to the user; after confirmation, a WhatsApp Flow collects the CVV. For PIX payments, it generates a PIX code for the user to complete the payment."
        instructions:
            # CONTEXTO GERAL
            - "You are an expert in processing checkout and payment information for customer orders."
            - "Whenever you receive the parameter product_items, you must start the checkout flow."
            - "Always when the tool needs the product_items parameter, you must format the product_items following the following format: [{\"product_retailer_id\": \"id#seller\", \"quantity\": 1, \"name\": \"Product Name\", \"item_price\": 25900, \"currency\": \"BRL\"}]. IMPORTANT: 'name' is required for WhatsApp messages, 'item_price' must be in cents (25900 = R$259.00)."
            - "Never make up the product_retailer_id or any product information. All product information must be informed to you by the manager."
            - "Only request the necessary data according to the client's payment preferences."
            
            # INÍCIO DO FLUXO
            - "STEP 1: Ask the user which payment method they prefer: CREDIT CARD or PIX. Skip this step if you already have this information."
            
            # PASSOS COMUNS - DELIVERY (Steps 2-4)
            - "STEP 2: Ask for the delivery method: 'delivery' (entrega) or 'pickup-in-point' (retirada em loja). Skip if you already have this information."
            - "STEP 3: Ask for the user's postal code (CEP)."
            - "STEP 4: Use the get_delivery_options tool with product_items, postal_code and delivery_method to retrieve available options. Present the options to the user and ask which one they prefer. IMPORTANT: Each option includes 'id' (sla_id) and 'price' (shipping value in cents) - you will need both values in the next steps."
            
            # FLUXO PIX (Steps 5-6)
            - "STEP 5 (PIX): After the user selects a delivery option, collect the remaining required data: email, document (CPF), contact_name (full name), number_house (skip if pickup-in-point, use the pickup point address), and optionally address_complement."
            - "STEP 6 (PIX): Use the create_cart_pix tool with all collected data including the sla_id from the chosen delivery option to generate the PIX code. The flow ends here."
            
            # FLUXO CARTÃO DE CRÉDITO (Steps 5-7)
            - "STEP 5 (CARD): After the user selects a delivery option, collect the user's email address. Then use the create_cart_card tool with product_items, email, and shipping_value (use the 'price' field from the selected delivery option as shipping_value). This will retrieve saved payment information and send a WhatsApp confirmation message with the correct shipping cost. Inform the user they will receive a message to confirm the payment."
            - "STEP 6 (CARD): When the user confirms (you will receive a payment_method JSON object), collect the remaining required data: document (CPF), contact_name (full name), number_house (skip if pickup-in-point, use the pickup point address), and optionally address_complement."
            - "STEP 7 (CARD): After confirmation, use the request_cvv_flow with the same data you would use for checkout: product_items, email, document, contact_name, postal_code, number_house, address_complement (if any), delivery_method, and sla_id. The tool creates the VTEX transaction, registers it with the payment backend, then sends the WhatsApp Flow for CVV. Optional: valor_pedido and final_cartao to override display strings; optional card_due_date (MM/YY) if required by your Flow. Do not ask for CVV in plain chat."
            
            # REGRAS IMPORTANTES - PIX
            - "Never say the PIX code or payment link will be sent by email."
            - "When the PIX was already sent to the user, just state that the PIX payment was created successfully, don't add anything else."
            - "When you receive the PIX code and it was not already sent to the user, you must respond with the code for payment."
            - "NEVER send a checkout link for PIX payments. PIX payments must be done with the pix copy paste code. When a PIX payment is successfully created and you don't receive the code, the user automatically received the PIX code — you must NOT send any link."
            
            # REGRAS IMPORTANTES - DELIVERY
            - "If the user chooses pickup-in-point but it's not available for their region, inform them and ask if they would like to continue with delivery at their address."
            - "When the delivery option is pickup-in-point, don't ask the user for the address number, use the number from the chosen pickup point."
            - "When the user asks for delivery options only, just execute the get_delivery_options tool and inform the options without generating any checkout link or code."
        guardrails:
            - "Don't talk about politics, religion or any other sensitive topic. Keep it neutral."
        tools:
            - create_cart_card:
                name: "Create Cart Credit Card"
                source:
                    path: "tools/create_cart_card"
                    entrypoint: "main.CreateCart"
                    path_test: "test_definition.yaml"
                description: "Retrieves payment information from customer email and sends WhatsApp confirmation message with shipping value. After user confirms, use request_cvv_flow to collect CVV via WhatsApp Flow."
                parameters:
                    - email:
                        description: "Customer email address to retrieve saved payment information"
                        type: "string"
                        required: true
                        contact_field: true
                    - product_items:
                        description: "Array of products in the format [{\"product_retailer_id\": \"id#seller\", \"quantity\": 1, \"name\": \"Product Name\", \"item_price\": 25900}]. IMPORTANT: 'name' is required for WhatsApp message, 'item_price' must be in cents."
                        type: "array"
                        required: true
                    - shipping_value:
                        description: "Shipping value in cents from the selected delivery option (the 'price' field returned by get_delivery_options tool)"
                        type: "number"
                        required: true
            - create_cart_pix:
                name: "Create Cart PIX"
                source:
                    path: "tools/create_cart_pix"
                    entrypoint: "main.CreateCart"
                    path_test: "test_definition.yaml"
                description: "Function to create a cart for a customer and process payment via PIX (instant payments)"
                parameters:
                    - product_items:
                        description: "Array of products in the format [{\"product_retailer_id\": \"id#seller\", \"quantity\": 1, \"name\": \"Product Name\", \"item_price\": 25900}]. 'item_price' must be in cents."
                        type: "array"
                        required: true
                    - postal_code:
                        description: "Customer postal code without special characters"
                        type: "string"
                        contact_field: true
                        required: true
                    - document:
                        description: "Customer document number (CPF) without special characters"
                        type: "string"
                        required: true
                        contact_field: true
                    - email:
                        description: "Customer email"
                        type: "string"
                        required: true
                        contact_field: true
                    - delivery_method:
                        description: "Delivery method: 'delivery' for home delivery or 'pickup-in-point' for store pickup"
                        type: "string"
                        required: true
                    - sla_id:
                        description: "SLA ID, this information will be provided by Get Delivery Options tool, but the user must provide it"
                        type: "string"
                        required: true
                        contact_field: true
                    - number_house:
                        description: "Number of the house that will receive the order"
                        type: "string"
                        required: true
                        contact_field: true
                    - address_complement:
                        description: "Complement of the address, if necessary (apartment number, point of refference, etc)"
                        type: "string"
                        required: false
                        contact_field: true
                    - contact_name:
                        description: "Complete name of the user, including first and last name."
                        type: "string"
                        required: true
                        contact_field: true
            - request_cvv_flow:
                name: "Request CVV WhatsApp Flow"
                source:
                    path: "tools/request_cvv_flow"
                    entrypoint: "main.RequestCvvFlow"
                    path_test: "test_definition.yaml"
                description: "Creates a full VTEX checkout and checkout transaction, fetches saved card info by email, registers flow_token and vtex_execution on payment-registrations (CHANNEL_UUID, PAYMENT_REGISTRATIONS_BASE_URL), then sends the CVV WhatsApp Flow via Weni Flows. Does not charge the card (no VTEX Vault) or call gatewayCallback. Requires contact channel_uuid and urn, project auth_token, VTEX credentials, and optional valor_pedido, final_cartao, card_due_date. Returns FinalResponse when the Flow is sent."
                parameters:
                    - product_items:
                        description: "Array of products [{\"product_retailer_id\": \"id#seller\", \"quantity\": 1, \"name\": \"Product Name\", \"item_price\": 25900}]. item_price in cents."
                        type: "array"
                        required: true
                    - email:
                        description: "Customer email (saved card profile)"
                        type: "string"
                        required: true
                        contact_field: true
                    - document:
                        description: "CPF/CNPJ without special characters"
                        type: "string"
                        required: true
                        contact_field: true
                    - contact_name:
                        description: "Full name (card holder)"
                        type: "string"
                        required: true
                        contact_field: true
                    - postal_code:
                        description: "Postal code (CEP)"
                        type: "string"
                        required: true
                        contact_field: true
                    - number_house:
                        description: "House number (or pickup point number for pickup-in-point)"
                        type: "string"
                        required: true
                        contact_field: true
                    - address_complement:
                        description: "Address complement if needed"
                        type: "string"
                        required: false
                        contact_field: true
                    - delivery_method:
                        description: "'delivery' or 'pickup-in-point'"
                        type: "string"
                        required: true
                    - sla_id:
                        description: "SLA id from get_delivery_options"
                        type: "string"
                        required: true
                        contact_field: true
                    - valor_pedido:
                        description: "Optional. Display total for Flow (e.g. R$ 150,00). If omitted, computed from checkout."
                        type: "string"
                        required: false
                    - final_cartao:
                        description: "Optional. Last four digits shown in Flow. If omitted, from saved card profile."
                        type: "string"
                        required: false
                        contact_field: true
                    - card_due_date:
                        description: "Optional. Card expiry MM/YY for payment registration body."
                        type: "string"
                        required: false
                        contact_field: true
            - get_delivery_options:
                name: "Get Delivery Options"
                source:
                    path: "tools/get_delivery_options"
                    entrypoint: "main.GetDeliveryOptions"
                    path_test: "test_definition.yaml"
                description: "Function to get available delivery options (delivery or pickup-in-point) for the customer's postal code"
                parameters:
                    - product_items:
                        description: "Array of products in the format [{\"product_retailer_id\": \"id#seller_id\", \"quantity\": 1, \"name\": \"Product Name\", \"item_price\": 25900}]. 'item_price' must be in cents."
                        type: "array"
                        required: true
                    - postal_code:
                        description: "Customer postal code without special characters"
                        type: "string"
                        contact_field: true
                        required: true
                    - delivery_method:
                        description: "Delivery method: 'delivery' for home delivery or 'pickup-in-point' for store pickup"
                        type: "string"
                        required: true
